version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: flaskcontacts
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"

  flask_app:
    build: .
    container_name: flask_app
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - .:/app  # <--- Esto sincroniza tus cambios al instante sin tener que reconstruir siempre
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DB=flaskcontacts
    depends_on:
      - mysql_db